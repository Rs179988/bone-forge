<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Iraa — Why Your High-Effort Videos Flop (14-Scene Dynamic Cut)</title>
<style>
  @font-face {

    src: url('../../assets/fonts/Ellak.ttf') format('truetype');
    font-weight: 100 900;

<body>
<!-- Pre-warm custom fonts in DOM so Canvas 2D context has all glyphs rasterized -->
<div style="position:fixed;left:-9999px;top:-9999px;opacity:0;pointer-events:none;">
  <span style="font-family:'Ellak';font-weight:800;"> preload </span>
  <span style="font-family:'Inter Tight';font-weight:900;"> preload </span>
  <span style="font-family:'Instrument Serif';font-style:italic;"> preload </span>
</div>
<canvas id="stage" width="1080" height="1920"></canvas>
<script src="../../rig/studio_rig.js"></script>
<script>
const canvas = document.getElementById("stage");
const ctx = canvas.getContext("2d");
const { spring, easeOutExpo, easeInOutCubic, applyCanvasCamera, clamp } = window.StudioRig;

window.BEAT_CLOCK = null;
window.STUDIO_LOCK = null;

window.PAL = {
  bg_obsidian: "#EAEAE6",
  bg_elevated: "#FFFFFF",
  surface_glass: "rgba(255, 255, 255, 0.88)",
  border_subtle: "rgba(17, 17, 17, 0.08)",
  border_dashed_vector: "#141414",
  ink_primary: "#141414",
  ink_muted: "#8E8E93",
  accent_primary: "#1D18A8",
  accent_secondary: "#FF9500",
  accent_tertiary: "#8014D8",
  accent_highlight_lime: "#BCE368",
  chart_gradients: ["#38A3A5", "#5E60CE", "#E05297", "#FF7B00"]
};

window.TYPO = {
  font_display: "'Inter Tight', 'Ellak', sans-serif",
  font_editorial_serif: "'Instrument Serif', serif",
  font_mono: "'DejaVu Sans Mono', monospace"
};

window.GRID_SIZE = 64;

window.initClock = function(clockData, studioLockData) {
  window.BEAT_CLOCK = clockData;
  if (studioLockData) {
    window.STUDIO_LOCK = studioLockData;
    const ds = studioLockData["3_design_system"] || {};
    if (ds.palette) {
      window.PAL = Object.assign({}, window.PAL, ds.palette);
      document.body.style.background = window.PAL.bg_obsidian;
    }
    if (ds.typography) {
      window.TYPO = Object.assign({}, window.TYPO, ds.typography);
    }
    if (ds.canvas_and_motion_effects && ds.canvas_and_motion_effects.grid_cell_size_px) {
      window.GRID_SIZE = ds.canvas_and_motion_effects.grid_cell_size_px;
    }
  }
  window.seekToFrame(0);
  return true;
};

function hexRgba(hex, alpha) {
  const h = (hex || "#141414").replace("#", "");
  const r = parseInt(h.substring(0, 2), 16) || 20;
  const g = parseInt(h.substring(2, 4), 16) || 20;
  const b = parseInt(h.substring(4, 6), 16) || 20;
  return `rgba(${r}, ${g}, ${b}, ${alpha})`;
}

// ============================================================================
// SHARED PRIMITIVE 1: LIGHT EDITORIAL GRAPH-PAPER GRID + CURVED RIBBONS
// ============================================================================
function drawLightGraphPaperCanvas(ctx, frame) {
  const P = window.PAL;
  const gs = window.GRID_SIZE || 64;

  ctx.save();
  ctx.fillStyle = P.bg_obsidian;
  ctx.fillRect(-300, -300, 1680, 2520);

  const shiftX = (frame * 0.5) % gs;
  const shiftY = (frame * 0.4) % gs;

  ctx.strokeStyle = P.border_subtle || "rgba(17, 17, 17, 0.08)";
  ctx.lineWidth = 1.5;
  for (let x = -256 + shiftX; x < 1344; x += gs) {
    ctx.beginPath();
    ctx.moveTo(x, -256);
    ctx.lineTo(x, 2176);
    ctx.stroke();
  }
  for (let y = -256 + shiftY; y < 2176; y += gs) {
    ctx.beginPath();
    ctx.moveTo(-256, y);
    ctx.lineTo(1344, y);
    ctx.stroke();
  }

  // Subtle crosshairs every 4 grid cells
  ctx.strokeStyle = "rgba(20, 20, 20, 0.14)";
  ctx.lineWidth = 2;
  for (let x = -gs * 4 + (shiftX * 2) % (gs * 4); x < 1280; x += gs * 4) {
    for (let y = -gs * 4 + (shiftY * 2) % (gs * 4); y < 2100; y += gs * 4) {
      ctx.beginPath();
      ctx.moveTo(x - 7, y); ctx.lineTo(x + 7, y);
      ctx.moveTo(x, y - 7); ctx.lineTo(x, y + 7);
      ctx.stroke();
    }
  }

  // Faint sweeping curved ribbons
  ctx.strokeStyle = hexRgba(P.accent_primary, 0.075);
  ctx.lineWidth = 44;
  ctx.lineCap = "round";
  ctx.beginPath();
  ctx.moveTo(-160, 360 + Math.sin(frame * 0.03) * 45);
  ctx.bezierCurveTo(360, 160, 720, 600, 1240, 320 + Math.cos(frame * 0.03) * 45);
  ctx.stroke();

  ctx.strokeStyle = hexRgba(P.accent_secondary, 0.08);
  ctx.lineWidth = 36;
  ctx.beginPath();
  ctx.moveTo(-160, 1540 + Math.cos(frame * 0.025) * 45);
  ctx.bezierCurveTo(380, 1740, 700, 1300, 1240, 1580 + Math.sin(frame * 0.025) * 45);
  ctx.stroke();
  ctx.restore();
}

function setFitFont(ctx, weight, startPx, family, text, maxWidth) {
  let px = startPx;
  ctx.font = `${weight} ${px}px ${family}`;
  while (ctx.measureText(text).width > maxWidth && px > 14) {
    px -= 2;
    ctx.font = `${weight} ${px}px ${family}`;
  }
  return px;
}

// ============================================================================
// SHARED PRIMITIVE 2: TRANSPARENT DASHED VECTOR SELECTION BOX (1-2 WORDS ONLY)
// Zero subLabel, zero solid box clutter—sits directly on the graph-paper grid!
// ============================================================================
function drawDashedSelectionBox(ctx, x, y, w, h, word, textHex, sVal, tintAlpha = 0.0) {
  const P = window.PAL;
  const T = window.TYPO;
  if (sVal <= 0.01) return;
  const cleanWord = String(word || "").trim();
  if (cleanWord.split(/\s+/).length > 3) {
    throw new Error(`Subtitle Ban Violation in drawDashedSelectionBox: "${cleanWord}"`);
  }

  ctx.save();
  ctx.translate(x, y);
  ctx.scale(sVal, sVal);

  if (tintAlpha > 0) {
    ctx.fillStyle = hexRgba(textHex || P.accent_primary, tintAlpha);
    ctx.fillRect(-w / 2, -h / 2, w, h);
  }

  // Dashed vector outline (#141414)
  ctx.strokeStyle = P.border_dashed_vector || "#141414";
  ctx.lineWidth = 3.5;
  ctx.setLineDash([12, 8]);
  ctx.strokeRect(-w / 2, -h / 2, w, h);
  ctx.setLineDash([]);

  // 4 Corner Vector Handle Dots
  const corners = [
    [-w / 2, -h / 2],
    [w / 2, -h / 2],
    [-w / 2, h / 2],
    [w / 2, h / 2]
  ];
  for (const [cx, cy] of corners) {
    ctx.fillStyle = P.bg_elevated;
    ctx.strokeStyle = P.border_dashed_vector;
    ctx.lineWidth = 3.5;
    ctx.beginPath();
    ctx.arc(cx, cy, 8.5, 0, Math.PI * 2);
    ctx.fill();
    ctx.stroke();

    ctx.fillStyle = textHex || P.accent_primary;
    ctx.beginPath();
    ctx.arc(cx, cy, 3.8, 0, Math.PI * 2);
    ctx.fill();
  }

  ctx.fillStyle = textHex || P.ink_primary;
  setFitFont(ctx, "900", 40, T.font_display, cleanWord, w - 48);
  ctx.textAlign = "center";
  ctx.textBaseline = "middle";
  ctx.fillText(cleanWord, 0, 2);

  ctx.restore();
}

// ============================================================================
// SHARED PRIMITIVE 3: EDITORIAL SERIF + BOLD DISPLAY MOTION-BLUR WIPE HEADER
// ============================================================================
function drawEditorialHeader(ctx, serifLead, boldPunch, accentHex, yPos, localF) {
  const P = window.PAL;
  const T = window.TYPO;
  const wipe1 = spring(localF, 0, { stiffness: 250, damping: 18 });
  const wipe2 = spring(localF, 6, { stiffness: 240, damping: 17 });

  ctx.save();
  ctx.translate(540, yPos);
  ctx.textAlign = "center";

  // Italic Instrument Serif Lead
  ctx.save();
  ctx.globalAlpha = clamp(wipe1, 0, 1);
  ctx.translate((1 - wipe1) * -80, 0);
  setFitFont(ctx, "italic", 62, T.font_editorial_serif, serifLead, 900);
  ctx.fillStyle = P.ink_primary;
  ctx.fillText(serifLead, 0, -78);
  ctx.restore();

  const fitPx = setFitFont(ctx, "900", 78, T.font_display, boldPunch, 800);
  const measuredW = ctx.measureText(boldPunch).width;

  // Horizontal Directional Motion-Blur Wipe for Bold Display Punch
  const dx = Math.abs(1 - wipe2) < 0.03 ? 0 : (1 - wipe2) * 190;
  if (Math.abs(dx) > 8) {
    for (let g = 1; g <= 3; g++) {
      ctx.save();
      ctx.globalAlpha = 0.11 * (4 - g);
      ctx.font = `900 ${fitPx}px ${T.font_display}`;
      ctx.fillStyle = accentHex || P.accent_primary;
      ctx.fillText(boldPunch, dx + g * 20, 26);
      ctx.restore();
    }
  }

  ctx.save();
  ctx.translate(dx, 26);
  ctx.scale(0.92 + 0.08 * wipe2, 0.92 + 0.08 * wipe2);

  const pillW = Math.min(920, Math.max(380, measuredW + 96));
  ctx.fillStyle = accentHex === P.accent_highlight_lime ? P.accent_highlight_lime : hexRgba(accentHex, 0.15);
  ctx.strokeStyle = P.border_dashed_vector;
  ctx.lineWidth = 3.5;
  ctx.beginPath();
  ctx.roundRect(-pillW / 2, -74, pillW, 102, 16);
  ctx.fill();
  ctx.stroke();

  ctx.font = `900 ${fitPx}px ${T.font_display}`;
  ctx.fillStyle = accentHex === P.accent_highlight_lime ? P.ink_primary : accentHex;
  ctx.fillText(boldPunch, 0, 8);
  ctx.restore();

  ctx.restore();
}

// ============================================================================
// SHARED PRIMITIVE 4: ROLLING AMBER (#FF9500) ODOMETER COUNTER
// ============================================================================
function drawAmberOdometer(ctx, x, y, valStr, tagWord, sVal) {
  const P = window.PAL;
  const T = window.TYPO;
  if (sVal <= 0.01) return;
  ctx.save();
  ctx.translate(x, y);
  ctx.scale(sVal, sVal);

  ctx.shadowColor = P.accent_secondary || "#FF9500";
  ctx.shadowBlur = 40;
  ctx.shadowOffsetX = 0;
  ctx.shadowOffsetY = 0;
  ctx.fillStyle = P.bg_elevated;
  ctx.strokeStyle = P.accent_secondary;
  ctx.lineWidth = 5;
  ctx.beginPath();
  ctx.roundRect(-215, -80, 430, 160, 22);
  ctx.fill();
  ctx.stroke();
  ctx.shadowColor = "transparent";
  ctx.shadowBlur = 0;

  ctx.strokeStyle = "rgba(20,20,20,0.08)";
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.moveTo(-195, -24); ctx.lineTo(195, -24);
  ctx.moveTo(-195, 24); ctx.lineTo(195, 24);
  ctx.stroke();

  ctx.fillStyle = P.accent_secondary;
  ctx.font = `900 72px ${T.font_mono}`;
  ctx.textAlign = "center";
  ctx.fillText(valStr, 0, 10);

  ctx.fillStyle = P.ink_primary;
  ctx.font = `800 24px ${T.font_display}`;
  ctx.fillText(tagWord, 0, 56);

  ctx.restore();
}

function drawFourPointStar(ctx, x, y, radius, rot, fillHex) {
  ctx.save();
  ctx.translate(x, y);
  ctx.rotate(rot);
  ctx.fillStyle = fillHex;
  ctx.strokeStyle = "#141414";
  ctx.lineWidth = 3;
  ctx.beginPath();
  for (let i = 0; i < 8; i++) {
    const a = (i * Math.PI) / 4;
    const r = i % 2 === 0 ? radius : radius * 0.32;
    if (i === 0) ctx.moveTo(Math.cos(a) * r, Math.sin(a) * r);
    else ctx.lineTo(Math.cos(a) * r, Math.sin(a) * r);
  }
  ctx.closePath();
  ctx.fill();
  ctx.stroke();
  ctx.restore();
}

function drawDashedPedestal(ctx, x, y, radius, frame) {
  const P = window.PAL;
  ctx.save();
  ctx.translate(x, y);

  ctx.save();
  ctx.rotate(frame * 0.009);
  ctx.strokeStyle = P.border_dashed_vector;
  ctx.lineWidth = 4.5;
  ctx.setLineDash([20, 12]);
  ctx.beginPath();
  ctx.arc(0, 0, radius + 32, 0, Math.PI * 2);
  ctx.stroke();
  ctx.setLineDash([]);
  ctx.restore();

  ctx.shadowColor = "rgba(20, 20, 20, 0.16)";
  ctx.shadowBlur = 36;
  ctx.shadowOffsetY = 16;
  ctx.fillStyle = P.bg_elevated;
  ctx.strokeStyle = P.ink_primary;
  ctx.lineWidth = 3.5;
  ctx.beginPath();
  ctx.arc(0, 0, radius, 0, Math.PI * 2);
  ctx.fill();
  ctx.stroke();
  ctx.restore();
}

// ============================================================================
// SCENE 01 (f: 0..90): 1.5s COBALT/LIME COLOR-BLOCK HOOK + LIVE BEZIER CURVE
// "Tumne apni pichli video ke 3-second ke transition..."
// ============================================================================
function renderScene01(ctx, frame, localF) {
  const P = window.PAL;
  const T = window.TYPO;

  ctx.fillStyle = P.accent_primary;
  ctx.fillRect(-200, -200, 1480, 2320);

  // Moving structural lines
  ctx.strokeStyle = "rgba(255,255,255,0.12)";
  ctx.lineWidth = 2;
  for (let i = -1080; i < 1920; i += 80) {
    ctx.beginPath();
    ctx.moveTo(-100, i + (localF * 2.0) % 80);
    ctx.lineTo(1180, i + 540 + (localF * 2.0) % 80);
    ctx.stroke();
  }

  const cardS = spring(localF, 0, { stiffness: 260, damping: 16 });
  ctx.save();
  ctx.translate(540, 960);
  ctx.scale(cardS, cardS);

  ctx.fillStyle = P.accent_highlight_lime;
  ctx.strokeStyle = "#141414";
  ctx.lineWidth = 6;
  ctx.shadowColor = "rgba(0,0,0,0.4)";
  ctx.shadowBlur = 42;
  ctx.shadowOffsetY = 18;
  ctx.beginPath();
  ctx.roundRect(-430, -390, 860, 780, 32);
  ctx.fill();
  ctx.stroke();
  ctx.shadowColor = "transparent";

  ctx.fillStyle = "#141414";
  ctx.font = `italic 62px ${T.font_editorial_serif}`;
  ctx.textAlign = "center";
  ctx.fillText("that 3-second transition...", 0, -275);

  ctx.font = `900 102px ${T.font_display}`;
  ctx.fillText("3.0 SEC", 0, -165);

  // Interactive Bezier Speed-Ramp Graph inside Dark Editor Window
  ctx.fillStyle = "#141414";
  ctx.beginPath();
  ctx.roundRect(-350, -105, 700, 340, 22);
  ctx.fill();

  const handleShift = Math.sin(localF * 0.14) * 55;
  ctx.strokeStyle = P.accent_secondary;
  ctx.lineWidth = 8;
  ctx.beginPath();
  ctx.moveTo(-270, 165);
  ctx.bezierCurveTo(-60, 165, 40, -35 + handleShift, 270, -35);
  ctx.stroke();

  // Bezier tangent handles
  ctx.strokeStyle = P.accent_highlight_lime;
  ctx.lineWidth = 3;
  ctx.beginPath();
  ctx.moveTo(40, -35 + handleShift);
  ctx.lineTo(270, -35);
  ctx.stroke();

  ctx.fillStyle = P.accent_highlight_lime;
  ctx.beginPath();
  ctx.arc(-270, 165, 13, 0, Math.PI * 2);
  ctx.arc(270, -35, 13, 0, Math.PI * 2);
  ctx.arc(40, -35 + handleShift, 11, 0, Math.PI * 2);
  ctx.fill();

  ctx.fillStyle = "#141414";
  setFitFont(ctx, "900", 54, T.font_display, "SPEED RAMP", 640);
  ctx.fillText("SPEED RAMP", 0, 315);

  drawFourPointStar(ctx, -360, -310, 36, localF * 0.07, P.accent_secondary);
  drawFourPointStar(ctx, 360, 310, 36, -localF * 0.07, "#FFFFFF");
  ctx.restore();
}

// ============================================================================
// SCENE 02 (f: 90..258): 4 HOURS OF NLE KEYFRAME LABOUR
// "...par 4 ghante lagaye..."
// ============================================================================
function renderScene02(ctx, frame, localF) {
  const P = window.PAL;
  drawEditorialHeader(ctx, "painstakingly keyframing for...", "4 HOURS", P.accent_primary, 310, localF);

  const odoS = spring(localF, 8, { stiffness: 220, damping: 16 });
  const hrsVal = Math.min(4.0, (localF / 40) * 4.0).toFixed(1);
  drawAmberOdometer(ctx, 540, 580, `${hrsVal} HRS`, "EDITING TIME", odoS);

  // Tactile Multi-Track NLE Timeline Cutout inside Dashed Pedestal
  const tlS = spring(localF, 14, { stiffness: 210, damping: 16 });
  ctx.save();
  ctx.translate(540, 1180);
  ctx.scale(tlS, tlS);

  drawDashedPedestal(ctx, 0, 0, 340, frame);

  // NLE Track Stack inside the circle
  const tracks = [
    { y: -130, col: P.chart_gradients[0], w: 460 },
    { y: -40,  col: P.chart_gradients[1], w: 500 },
    { y: 50,   col: P.chart_gradients[2], w: 460 },
    { y: 140,  col: P.chart_gradients[3], w: 380 }
  ];
  for (let i = 0; i < tracks.length; i++) {
    const tr = tracks[i];
    ctx.fillStyle = tr.col;
    ctx.strokeStyle = P.ink_primary;
    ctx.lineWidth = 3.5;
    ctx.beginPath();
    ctx.roundRect(-tr.w / 2, tr.y - 28, tr.w, 56, 12);
    ctx.fill();
    ctx.stroke();

    // Keyframe diamonds along each track
    for (let k = -tr.w / 2 + 45; k < tr.w / 2 - 30; k += 75) {
      ctx.save();
      ctx.translate(k, tr.y);
      ctx.rotate(Math.PI / 4);
      ctx.fillStyle = P.bg_elevated;
      ctx.strokeStyle = P.ink_primary;
      ctx.lineWidth = 2.5;
      ctx.fillRect(-9, -9, 18, 18);
      ctx.strokeRect(-9, -9, 18, 18);
      ctx.restore();
    }
  }

  // Sweeping Playhead Needle
  const phX = -210 + ((localF * 4.5) % 420);
  ctx.strokeStyle = P.accent_secondary;
  ctx.lineWidth = 6;
  ctx.beginPath();
  ctx.moveTo(phX, -210);
  ctx.lineTo(phX, 210);
  ctx.stroke();

  ctx.restore();

  drawDashedSelectionBox(ctx, 290, 1690, 380, 100, "KEYFRAMES", P.accent_primary, spring(localF, 28));
  drawDashedSelectionBox(ctx, 790, 1690, 380, 100, "GLOW FX", P.accent_tertiary, spring(localF, 38));
}

// ============================================================================
// SCENE 03 (f: 258..449): 0.5-SECOND SMARTPHONE SWIPE SIMULATION
// "...aur viewer ne use 0.5 second mein swipe kar diya."
// ============================================================================
function renderScene03(ctx, frame, localF) {
  const P = window.PAL;
  drawEditorialHeader(ctx, "and the viewer swiped in...", "0.5 SECONDS", P.accent_highlight_lime, 290, localF);

  const swipeProgress = easeInOutCubic(clamp((localF - 28) / 42, 0, 1));

  // Center Recognizable Smartphone Bezel + Physical Thumb Swipe Gesture
  ctx.save();
  ctx.translate(540, 990);

  // Phone Outer Body
  ctx.shadowColor = "rgba(20, 20, 20, 0.22)";
  ctx.shadowBlur = 40;
  ctx.shadowOffsetY = 20;
  ctx.fillStyle = "#141414";
  ctx.beginPath();
  ctx.roundRect(-250, -430, 500, 860, 54);
  ctx.fill();
  ctx.shadowColor = "transparent";

  // Phone Screen Viewport (Clipped)
  ctx.save();
  ctx.beginPath();
  ctx.roundRect(-226, -402, 452, 804, 40);
  ctx.clip();

  ctx.fillStyle = "#F4F4F0";
  ctx.fillRect(-226, -402, 452, 804);

  // Incoming next reel below
  ctx.fillStyle = P.bg_elevated;
  ctx.strokeStyle = P.ink_primary;
  ctx.lineWidth = 4;
  ctx.beginPath();
  ctx.roundRect(-190, 420 - swipeProgress * 680, 380, 520, 24);
  ctx.fill();
  ctx.stroke();
  ctx.fillStyle = P.accent_primary;
  setFitFont(ctx, "900", 36, window.TYPO.font_display, "NEXT VIDEO", 320);
  ctx.textAlign = "center";
  ctx.fillText("NEXT VIDEO", 0, 680 - swipeProgress * 680);

  // Your 4-Hour Video Card getting swiped UP off screen!
  ctx.save();
  ctx.translate(0, -swipeProgress * 720);
  ctx.fillStyle = P.accent_tertiary;
  ctx.strokeStyle = P.ink_primary;
  ctx.lineWidth = 4;
  ctx.beginPath();
  ctx.roundRect(-190, -310, 380, 540, 24);
  ctx.fill();
  ctx.stroke();

  ctx.fillStyle = "#FFFFFF";
  setFitFont(ctx, "900", 34, window.TYPO.font_display, "YOUR 4-HR EDIT", 320);
  ctx.fillText("YOUR 4-HR EDIT", 0, -40);
  ctx.restore();

  // Tactile Stylized Hand / Thumb Swipe Trail
  const thumbY = 180 - swipeProgress * 440;
  ctx.strokeStyle = P.accent_secondary;
  ctx.lineWidth = 14;
  ctx.lineCap = "round";
  ctx.setLineDash([14, 12]);
  ctx.beginPath();
  ctx.moveTo(0, 220);
  ctx.lineTo(0, thumbY);
  ctx.stroke();
  ctx.setLineDash([]);

  // Touch Circle + Upward Arrow
  ctx.fillStyle = P.accent_secondary;
  ctx.strokeStyle = "#141414";
  ctx.lineWidth = 4;
  ctx.beginPath();
  ctx.arc(0, thumbY, 38, 0, Math.PI * 2);
  ctx.fill();
  ctx.stroke();

  ctx.restore();
  ctx.restore();

  drawAmberOdometer(ctx, 540, 1630, "0.5 SEC", "SWIPE SPEED", spring(localF, 12));
}

// ============================================================================
// SCENE 04 (f: 449..590): "BURA LAGA? GOOD. AB SACH SUNO."
// ============================================================================
function renderScene04(ctx, frame, localF) {
  const P = window.PAL;
  drawEditorialHeader(ctx, "did that hurt your ego?", "SACH SUNO", P.accent_secondary, 310, localF);

  drawDashedSelectionBox(ctx, 290, 540, 400, 108, "BURA LAGA?", P.ink_primary, spring(localF, 5), 0.06);
  drawDashedSelectionBox(ctx, 790, 540, 400, 108, "GOOD.", P.accent_primary, spring(localF, 22), 0.10);

  // Center 3D Tactile Target Bullseye with Arrow Impact at localF = 45
  const bullS = spring(localF, 15, { stiffness: 230, damping: 15 });
  ctx.save();
  ctx.translate(540, 1140);
  ctx.scale(bullS, bullS);

  drawDashedPedestal(ctx, 0, 0, 320, frame);

  const rings = [
    [260, P.accent_primary],
    [185, P.bg_elevated],
    [115, P.accent_tertiary],
    [55,  P.accent_secondary]
  ];

  ctx.stroke();
  ctx.fillStyle = P.ink_primary;
  setFitFont(ctx, "900", 36, window.TYPO.font_display, "SCRIPT", 220);
  ctx.fillText("SCRIPT", 310, -68);
  ctx.restore();

  ctx.restore();
}

// ============================================================================
// SCENE 14 (f: 3409..3685): DELETE THAT FANCY INTRO (SLAM @ f=3503) -> BLACK CUT
// "apna timeline kholo aur sabse pehle woh fancy intro udao."
// ============================================================================
function renderScene14(ctx, frame, localF) {
  const P = window.PAL;
  const T = window.TYPO;

  if (frame >= 3675) {
    ctx.fillStyle = "#141414";
    ctx.fillRect(-300, -300, 1680, 2520);
    ctx.fillStyle = P.accent_highlight_lime;
    setFitFont(ctx, "900", 68, T.font_display, "DELETE THAT INTRO.", 900);
    ctx.textAlign = "center";
    ctx.fillText("DELETE THAT INTRO.", 540, 960);
    return;
  }

  const delTriggerF = 3503;
  const isDeleted = frame >= delTriggerF;
  const shake = (frame >= delTriggerF && frame <= delTriggerF + 18)
    ? Math.sin((frame - delTriggerF) * 3.4) * 20 * (1 - (frame - delTriggerF) / 18)
    : 0;

  ctx.save();
  ctx.translate(shake, -shake * 0.6);

  drawEditorialHeader(
    ctx,
    "open your timeline right now &...",
    isDeleted ? "INTRO DELETED" : "DELETE INTRO",
    isDeleted ? P.accent_highlight_lime : P.accent_secondary,
    300,
    localF
  );

  // Single Centered Timeline Stage (NEVER two side-by-side boxes so ZERO overlap ever occurs!)
  ctx.save();
  ctx.translate(540, 920);

  ctx.fillStyle = P.bg_elevated;
  ctx.strokeStyle = P.ink_primary;
  ctx.lineWidth = 4.5;
  ctx.shadowColor = "rgba(20,20,20,0.16)";
  ctx.shadowBlur = 34;
  ctx.shadowOffsetY = 14;
  ctx.beginPath();
  ctx.roundRect(-430, -210, 860, 420, 26);
  ctx.fill();
  ctx.stroke();
  ctx.shadowColor = "transparent";

  // Playhead needle at 00:00
  ctx.strokeStyle = P.accent_primary;
  ctx.lineWidth = 6;
  ctx.beginPath();
  ctx.moveTo(-360, -140);
  ctx.lineTo(-360, 140);
  ctx.stroke();

  if (!isDeleted) {
    drawDashedSelectionBox(ctx, 20, 0, 620, 150, "FANCY INTRO", P.accent_secondary, 1.0, 0.14);
  } else {
    const snapS = spring(frame, delTriggerF, { stiffness: 280, damping: 15 });
    drawDashedSelectionBox(ctx, 20, 0, 620, 150, "00:00 HOOK", P.accent_primary, snapS, 0.15);
  }

  ctx.restore();

  // Giant Tactile 3D Mechanical [ DELETE ] Keycap at Y = 1480
  const keyPress = isDeleted ? spring(frame, delTriggerF, { stiffness: 340, damping: 14 }) : 0;
  ctx.save();
  ctx.translate(540, 1480 + keyPress * 28);

  // 3D Keycap Base
  ctx.fillStyle = P.ink_primary;
  ctx.beginPath();
  ctx.roundRect(-310, -75 + (1 - keyPress) * 28, 620, 175, 30);
  ctx.fill();

  // 3D Keycap Top Surface
  ctx.fillStyle = isDeleted ? P.accent_secondary : P.bg_elevated;
  ctx.strokeStyle = P.ink_primary;
  ctx.lineWidth = 5;
  ctx.beginPath();
  ctx.roundRect(-310, -90, 620, 170, 28);
  ctx.fill();
  ctx.stroke();

  ctx.fillStyle = P.ink_primary;
  setFitFont(ctx, "900", 56, T.font_display, isDeleted ? "DELETED ✓" : "[ DELETE ]", 540);
  ctx.textAlign = "center";
  ctx.fillText(isDeleted ? "DELETED ✓" : "[ DELETE ]", 0, 16);
  ctx.restore();

  ctx.restore();
}

// ============================================================================
// MASTER FRAME DISPATCHER WITH LIVING 2D CANVAS CAMERA
// ============================================================================
const SCENE_RENDERERS = [
  renderScene01, renderScene02, renderScene03, renderScene04,
  renderScene05, renderScene06, renderScene07, renderScene08,
  renderScene09, renderScene10, renderScene11, renderScene12,
  renderScene13, renderScene14
];

window.seekToFrame = function(frame) {
  if (!window.BEAT_CLOCK || !window.BEAT_CLOCK.scenes) return false;
  const scenes = window.BEAT_CLOCK.scenes;
  let activeIdx = scenes.length - 1;
  for (let i = 0; i < scenes.length; i++) {
    if (frame >= scenes[i].start_frame && frame < scenes[i].end_frame) {
      activeIdx = i;
      break;
    }
  }

  const sc = scenes[activeIdx];
  const localF = frame - sc.start_frame;

  ctx.save();
  ctx.clearRect(0, 0, 1080, 1920);

  // Apply Living Camera Transform to the 2D Canvas
  applyCanvasCamera(ctx, frame, sc.start_frame, sc.end_frame, sc.camera || "push_in", 540, 960);

  // Scene 1 (0..90) has its own full-bleed Cobalt color-block background;
  // Scenes 2..14 render over the Light Editorial Graph-Paper Grid
  if (activeIdx > 0 && frame < 3675) {
    drawLightGraphPaperCanvas(ctx, frame);
  }

  SCENE_RENDERERS[activeIdx](ctx, frame, localF);
  ctx.restore();
  return true;
};
