<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Studio Stage 1080x1920</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    width: 1080px;
    height: 1920px;
    overflow: hidden;
    background: #08090D;
    color: #F4F1EA;
    font-family: 'Liberation Sans', 'Nimbus Sans', sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  #viewport {
    position: relative;
    width: 1080px;
    height: 1920px;
    overflow: hidden;
    background:
      radial-gradient(circle at 50% 24%, rgba(255, 59, 48, 0.11) 0%, rgba(16, 185, 129, 0.05) 38%, rgba(8, 9, 13, 0.98) 76%),
      #08090D;
  }
  /* Subtle architectural grid */
  .studio-grid {
    position: absolute;
    inset: 0;
    background-image:
      linear-gradient(to right, rgba(244, 241, 234, 0.035) 1px, transparent 1px),
      linear-gradient(to bottom, rgba(244, 241, 234, 0.035) 1px, transparent 1px);
    background-size: 90px 90px;
    pointer-events: none;
  }
  #camera-rig {
    position: absolute;
    inset: 0;
    width: 1080px;
    height: 1920px;
    transform-origin: 540px 960px;
    will-change: transform, filter;
  }
  .hud-top {
    position: absolute;
    top: 68px;
    left: 72px;
    right: 72px;
    height: 54px;
    display: flex;
    align-items: center;
    justify-content: center; gap: 64px;
    padding: 0 24px;
    background: rgba(17, 20, 29, 0.82);
    border: 1px solid rgba(244, 241, 234, 0.14);
    border-radius: 14px;
    font-family: 'DejaVu Sans Mono', monospace;
    font-size: 20px;
    letter-spacing: 1.5px;
    color: #8E95A8;
    z-index: 20;
  }
  .hud-left, .hud-right { display: flex; align-items: center; gap: 16px; }
  .rec-dot {
    width: 13px;
    height: 13px;
    border-radius: 50%;
    background: #FF3B30;
    box-shadow: 0 0 14px #FF3B30;
  }
  .hud-tc { color: #F4F1EA; font-weight: 700; }

  .archetype-stage {
    position: absolute;
    top: 175px;
    left: 72px;
    right: 72px;
    bottom: 245px;
    display: flex;
    flex-direction: column;
    justify-content: center; gap: 64px;
    padding: 36px 0;
  }
  .kinetic-header {
    display: flex;
    flex-direction: column;
    gap: 14px;
  }
  .eyebrow-pill {
    align-self: flex-start;
    font-family: 'DejaVu Sans Mono', monospace;
    font-size: 21px;
    font-weight: 700;
    letter-spacing: 2.5px;
    color: #FFB800;
    background: rgba(255, 184, 0, 0.12);
    border: 1px solid rgba(255, 184, 0, 0.35);
    padding: 10px 20px;
    border-radius: 999px;
  }
  .punch-line-1 {
    font-size: 92px;
    font-weight: 900;
    line-height: 1.02;
    letter-spacing: -2px;
    color: #F4F1EA;
  }
  .punch-line-2 {
    font-size: 96px;
    font-weight: 900;
    line-height: 1.02;
    letter-spacing: -2px;
  }
  .accent-red { color: #FF3B30; }
  .accent-gold { color: #FFB800; }
  .accent-emerald { color: #10B981; }

  .focal-card {
    background: rgba(17, 20, 29, 0.88);
    border: 2px solid rgba(244, 241, 234, 0.15);
    border-radius: 36px;
    padding: 52px;
    box-shadow: 0 32px 80px rgba(0, 0, 0, 0.65);
  }
  .gauge-card {
    position: relative;
    height: 680px;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .gauge-center {
    position: absolute;
    display: flex;
    flex-direction: column;
    align-items: center;
    text-align: center;
  }
  .gauge-num {
    font-size: 118px;
    font-weight: 900;
    color: #F4F1EA;
    line-height: 1;
  }
  .gauge-unit { font-size: 64px; color: #FF3B30; }
  .gauge-label {
    margin-top: 14px;
    font-family: 'DejaVu Sans Mono', monospace;
    font-size: 20px;
    letter-spacing: 2px;
    color: #8E95A8;
  }

  .compare-stack {
    display: flex;
    flex-direction: column;
    gap: 36px;
  }
  .compare-card {
    padding: 46px 48px;
    border-radius: 32px;
    background: rgba(17, 20, 29, 0.90);
    border: 2px solid rgba(244, 241, 234, 0.14);
  }
  .card-bad { border-left: 10px solid #FF3B30; }
  .card-good { border-left: 10px solid #10B981; background: rgba(16, 185, 129, 0.07); }
  .card-badge {
    font-family: 'DejaVu Sans Mono', monospace;
    font-size: 20px;
    font-weight: 700;
    letter-spacing: 2px;
    margin-bottom: 14px;
  }
  .badge-red { color: #FF3B30; }
  .badge-green { color: #10B981; }
  .card-stat {
    font-size: 68px;
    font-weight: 900;
    color: #F4F1EA;
    margin-bottom: 10px;
  }
  .card-desc {
    font-size: 30px;
    color: #8E95A8;
    font-weight: 600;
  }

  .nodes-container {
    display: flex;
    flex-direction: column;
    gap: 28px;
  }
  .arch-node {
    display: flex;
    align-items: center;
    gap: 32px;
    padding: 38px 42px;
    border-radius: 28px;
    background: rgba(17, 20, 29, 0.9);
    border: 2px solid rgba(244, 241, 234, 0.14);
  }
  .arch-node.node-active {
    border-color: rgba(16, 185, 129, 0.55);
    box-shadow: 0 18px 48px rgba(16, 185, 129, 0.12);
  }
  .node-step {
    font-family: 'DejaVu Sans Mono', monospace;
    font-size: 44px;
    font-weight: 900;
    color: #FFB800;
    background: rgba(255, 184, 0, 0.12);
    width: 92px;
    height: 92px;
    border-radius: 22px;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .node-body { flex: 1; }
  .node-title { font-size: 46px; font-weight: 900; color: #F4F1EA; }
  .node-ms {
    margin-top: 6px;
    font-family: 'DejaVu Sans Mono', monospace;
    font-size: 22px;
    color: #10B981;
    letter-spacing: 1.5px;
  }
  .node-status-dot {
    width: 20px;
    height: 20px;
    border-radius: 50%;
    background: #10B981;
    box-shadow: 0 0 16px #10B981;
  }

  .payoff-card {
    display: flex;
    flex-direction: column;
    gap: 42px;
    padding: 58px 52px;
  }
  .bar-row { display: flex; flex-direction: column; gap: 16px; }
  .bar-meta {
    display: flex;
    justify-content: center; gap: 64px;
    font-family: 'DejaVu Sans Mono', monospace;
    font-size: 28px;
    font-weight: 700;
  }
  .bar-label { color: #F4F1EA; }
  .bar-track {
    width: 100%;
    height: 36px;
    background: rgba(244, 241, 234, 0.08);
    border-radius: 18px;
    overflow: hidden;
  }
  .bar-fill {
    height: 100%;
    border-radius: 18px;
  }

  .host-dock {
    position: absolute;
    bottom: 68px;
    left: 72px;
    right: 72px;
    height: 132px;
    background: rgba(17, 20, 29, 0.92);
    border: 1px solid rgba(244, 241, 234, 0.16);
    border-radius: 28px;
    padding: 0 36px;
    display: flex;
    align-items: center;
    gap: 28px;
    z-index: 20;
  }
  .host-avatar {
    position: relative;
    width: 76px;
    height: 76px;
    border-radius: 50%;
    background: #FF3B30;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 36px;
    font-weight: 900;
    color: #08090D;
  }
  .host-meta { flex: 1; }
  .host-name {
    font-family: 'DejaVu Sans Mono', monospace;
    font-size: 22px;
    font-weight: 700;
    color: #F4F1EA;
    letter-spacing: 1.5px;
  }
  .host-sub {
    margin-top: 6px;
    font-size: 20px;
    color: #8E95A8;
    font-family: 'DejaVu Sans Mono', monospace;
  }
  .voice-meter {
    display: flex;
    align-items: center;
    gap: 8px;
    height: 50px;
  }
  .voice-meter span {
    width: 8px;
    background: #10B981;
    border-radius: 4px;
  }
</style>
</head>
<body>
  <div id="viewport">
    <div class="studio-grid"></div>
    <div id="hud-mount"></div>
    <div id="camera-rig"></div>
    <div id="dock-mount"></div>
  </div>

  <script src="../../rig/studio_rig.js"></script>
  <script src="../../archetypes/scene_archetypes.js"></script>
  <script>
    window.BEAT_CLOCK = null;

    window.initClock = function(clockData) {
      window.BEAT_CLOCK = clockData;
      window.seekToFrame(0);
      return true;
    };

    window.seekToFrame = function(frame) {
      if (!window.BEAT_CLOCK) return false;
      const beats = window.BEAT_CLOCK.beats;
      let activeIdx = 0;
      for (let i = 0; i < beats.length; i++) {
        if (frame >= beats[i].start_frame && frame < beats[i].end_frame) {
          activeIdx = i;
          break;
        }
        if (frame >= beats[beats.length - 1].end_frame) {
          activeIdx = beats.length - 1;
        }
      }
      const beat = beats[activeIdx];
      const cam = window.StudioRig.computeCameraTransform(frame, beat.start_frame, beat.end_frame, beat.camera_mode);

      const rigEl = document.getElementById("camera-rig");
      rigEl.style.transform = cam.transform;
      rigEl.style.filter = cam.filter;

      const fn = window.StudioArchetypes[beat.archetype];
      rigEl.innerHTML = fn ? fn(frame, beat) : "";

      document.getElementById("hud-mount").innerHTML = window.StudioArchetypes.renderHeaderHUD(frame, activeIdx, beat);
      document.getElementById("dock-mount").innerHTML = window.StudioArchetypes.renderHostDock(frame, beat);
      return true;
    };
  </script>
</body>
</html>
<style>

    height: auto !important;
    padding: 54px 48px !important;
    display: flex !important;

    gap: 28px !important;
  }
  .gauge-ring-wrap {
    position: relative;
    width: 480px;
    height: 480px;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .gauge-num { font-size: 136px !important; }
  .gauge-footer-badge {
    font-family: 'DejaVu Sans Mono', monospace;
    font-size: 26px;
    font-weight: 700;
    letter-spacing: 2.5px;
    color: #F4F1EA;
    background: rgba(255, 59, 48, 0.16);
    border: 1px solid rgba(255, 59, 48, 0.45);
    padding: 14px 32px;
    border-radius: 999px;
  }
  .card-badge { font-size: 24px !important; }
  .node-ms { font-size: 26px !important; font-weight: 700 !important; }
  .host-sub { font-size: 23px !important; color: #F4F1EA !important; opacity: 0.78; }
</style>
