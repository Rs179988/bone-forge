<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>The Casino Mind Trap — Studio Lock Live Palette Cut</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    width: 1080px;
    height: 1920px;
    overflow: hidden;
    background: #3B2336;
  }
  canvas {
    display: block;
    width: 1080px;
    height: 1920px;
  }
</style>
</head>
<body>
<canvas id="stage" width="1080" height="1920"></canvas>
<script src="../../rig/studio_rig.js"></script>
<script>
const canvas = document.getElementById("stage");
const ctx = canvas.getContext("2d");
const { spring, easeOutExpo, easeInOutCubic, clamp } = window.StudioRig;

window.BEAT_CLOCK = null;
window.STUDIO_LOCK = null;

// Default fallback matches studio_lock.json 6-swatch Rooster Palette
window.PAL = {
  bg_obsidian: "#3B2336",      // Swatch 1: Deep Aubergine Plum
  bg_elevated: "#261523",      // Darker Aubergine Shadow
  ink_primary: "#E7E4DD",      // Swatch 6: Warm Vintage Bone Cream
  ink_muted: "#F38BA8",        // Swatch 4: Flamingo Pink
  accent_vermilion: "#F24414", // Swatch 3: Fiery Vermilion Orange-Red
  accent_gold: "#FBA40D",      // Swatch 5: Golden Marigold Amber
  accent_emerald: "#009E83",   // Swatch 2: Vibrant Jade Teal
  accent_pink: "#F38BA8"       // Swatch 4: Flamingo Pink
};

window.initClock = function(clockData, studioLockData) {
  window.BEAT_CLOCK = clockData;
  if (studioLockData) {
    window.STUDIO_LOCK = studioLockData;
    const ds = studioLockData["3_design_system"] || studioLockData["design_system"] || {};
    if (ds.palette) {
      window.PAL = Object.assign({}, window.PAL, ds.palette);
      document.body.style.background = window.PAL.bg_obsidian;
    }
  }
  window.seekToFrame(0);
  return true;
};

function hash(n) {
  const x = Math.sin(n * 127.1 + 311.7) * 43758.5453123;
  return x - Math.floor(x);
}

// Convert Hex (#RRGGBB) to rgba(r,g,b,a) dynamically so any hex edited in studio_lock.json works with alpha!
function hexRgba(hex, alpha) {
  const h = (hex || "#3B2336").replace("#", "");
  const r = parseInt(h.substring(0, 2), 16) || 59;
  const g = parseInt(h.substring(2, 4), 16) || 35;
  const b = parseInt(h.substring(4, 6), 16) || 54;
  return `rgba(${r}, ${g}, ${b}, ${alpha})`;
}

// Cinematic Post-Processing Pass driven by studio_lock.json
function applyPostProcessing(ctx, frame, flashIntensity = 0) {
  const P = window.PAL;
  const vig = ctx.createRadialGradient(540, 960, 420, 540, 960, 1180);
  vig.addColorStop(0, "rgba(0,0,0,0)");
  vig.addColorStop(0.7, hexRgba(P.bg_elevated, 0.35));
  vig.addColorStop(1, hexRgba("#140912", 0.85));
  ctx.fillStyle = vig;
  ctx.fillRect(0, 0, 1080, 1920);

  // Floating volumetric motes in Marigold, Flamingo Pink & Bone Cream
  ctx.save();
  for (let i = 0; i < 45; i++) {
    const px = (hash(i * 13) * 1080 + frame * (0.4 + hash(i) * 0.8)) % 1080;
    const py = (hash(i * 29) * 1920 - frame * (0.6 + hash(i * 3) * 1.1) + 19200) % 1920;
    const r = 1.8 + hash(i * 7) * 3.8;
    const alpha = 0.12 + 0.22 * Math.sin(frame * 0.08 + i);
    const colHex = i % 3 === 0 ? P.accent_gold : (i % 3 === 1 ? P.accent_pink : P.ink_primary);
    ctx.fillStyle = hexRgba(colHex, alpha);
    ctx.beginPath();
    ctx.arc(px, py, r, 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.restore();

  // Subtle 6-Swatch Studio Palette Strip at very top edge (8px bar) + impact flash
  const swatches = [P.bg_obsidian, P.accent_emerald, P.accent_vermilion, P.accent_pink, P.accent_gold, P.ink_primary];
  for (let s = 0; s < 6; s++) {
    ctx.fillStyle = swatches[s];
    ctx.fillRect(s * 180, 0, 180, 10);
  }

  if (flashIntensity > 0.01) {
    ctx.fillStyle = hexRgba(P.ink_primary, flashIntensity * 0.65);
    ctx.fillRect(0, 0, 1080, 1920);
  }
}

function drawKineticTitle(ctx, topLabel, mainWord1, mainWord2, accentColor, yPos, enterSpring) {
  const P = window.PAL;
  ctx.save();
  ctx.translate(540, yPos + (1 - enterSpring) * 70);
  ctx.scale(0.88 + 0.12 * enterSpring, 0.88 + 0.12 * enterSpring);
  ctx.globalAlpha = clamp(enterSpring, 0, 1);
  ctx.textAlign = "center";

  // Pill badge in Flamingo Pink / Gold
  ctx.fillStyle = hexRgba(P.bg_elevated, 0.88);
  ctx.strokeStyle = P.accent_pink;
  ctx.lineWidth = 3;
  ctx.beginPath();
  ctx.roundRect(-290, -135, 580, 54, 27);
  ctx.fill();
  ctx.stroke();

  ctx.font = "800 24px 'DejaVu Sans Mono', monospace";
  ctx.fillStyle = P.accent_gold;
  ctx.fillText(topLabel, 0, -100);

  ctx.font = "900 94px 'Liberation Sans', sans-serif";
  ctx.fillStyle = P.ink_primary;
  ctx.shadowColor = "rgba(20, 8, 18, 0.95)";
  ctx.shadowBlur = 32;
  ctx.fillText(mainWord1, 0, 0);

  ctx.font = "900 104px 'Liberation Sans', sans-serif";
  ctx.fillStyle = accentColor;
  ctx.shadowColor = accentColor;
  ctx.shadowBlur = 30;
  ctx.fillText(mainWord2, 0, 104);

  ctx.restore();
}

// ============================================================================
// SHOT 1 (f: 0..175): MACRO MECHANICAL CLOCK SHATTERING IN 3D SPACE
// ============================================================================
function renderShot01_ClockShatter(ctx, frame, f0, dur) {
  const P = window.PAL;
  const localF = frame - f0;
  const prog = clamp(localF / dur, 0, 1);

  const shatterT = clamp((localF - 82) / 55, 0, 1);
  const impactShake = (localF >= 82 && localF <= 105) ? Math.sin(localF * 2.8) * 18 * (1 - (localF - 82) / 23) : 0;
  const camZoom = 1.0 + easeInOutCubic(prog) * 0.42;

  ctx.save();
  ctx.translate(540 + impactShake, 980 - impactShake * 0.6);
  ctx.scale(camZoom, camZoom);

  // Aubergine base + Vermilion/Marigold radial spotlight
  const bgGlow = ctx.createRadialGradient(0, 0, 30, 0, 0, 760);
  bgGlow.addColorStop(0, shatterT > 0 ? hexRgba(P.accent_vermilion, 0.52) : hexRgba(P.accent_gold, 0.35));
  bgGlow.addColorStop(0.55, P.bg_obsidian);
  bgGlow.addColorStop(1, P.bg_elevated);
  ctx.fillStyle = bgGlow;
  ctx.fillRect(-700, -1100, 1400, 2200);

  // Rotating 3D concentric rings in Jade Teal, Flamingo Pink, and Marigold
  const ringColors = [P.accent_emerald, P.accent_pink, P.accent_gold];
  for (let g = 0; g < 3; g++) {
    ctx.save();
    ctx.rotate((frame * (0.008 - g * 0.005)) * (g % 2 === 0 ? 1 : -1));
    ctx.strokeStyle = hexRgba(ringColors[g], 0.38 - g * 0.06);
    ctx.lineWidth = 18 - g * 4;
    ctx.setLineDash([28, 18]);
    ctx.beginPath();
    ctx.arc(0, 0, 330 + g * 85 + shatterT * 180, 0, Math.PI * 2);
    ctx.stroke();
    ctx.restore();
  }

  // Main Horological Clock Dial (Splits into 12 exploding shards when shatterT > 0)
  const numShards = 12;
  for (let s = 0; s < numShards; s++) {
    const a1 = (s / numShards) * Math.PI * 2;
    const a2 = ((s + 1) / numShards) * Math.PI * 2;
    const midA = (a1 + a2) / 2;

    const explodeDist = easeOutExpo(shatterT) * (180 + hash(s * 11) * 260);
    const rotShard = easeOutExpo(shatterT) * (hash(s * 5) - 0.5) * 1.4;

    ctx.save();
    ctx.translate(Math.cos(midA) * explodeDist, Math.sin(midA) * explodeDist);
    ctx.rotate(rotShard);

    ctx.beginPath();
    ctx.moveTo(0, 0);
    ctx.arc(0, 0, 290, a1, a2);
    ctx.closePath();
    ctx.clip();

    // Warm Vintage Bone Cream & Deep Aubergine Dial
    const dialGrad = ctx.createRadialGradient(0, 0, 20, 0, 0, 285);
    dialGrad.addColorStop(0, P.bg_obsidian);
    dialGrad.addColorStop(0.75, P.bg_elevated);
    dialGrad.addColorStop(1, P.accent_emerald);
    ctx.fillStyle = dialGrad;
    ctx.beginPath();
    ctx.arc(0, 0, 280, 0, Math.PI * 2);
    ctx.fill();

    // Bezel in Marigold -> Vermilion on shatter
    ctx.strokeStyle = shatterT > 0 ? P.accent_vermilion : P.accent_gold;
    ctx.lineWidth = 18;
    ctx.beginPath();
    ctx.arc(0, 0, 270, 0, Math.PI * 2);
    ctx.stroke();

    // Tick marks in Bone Cream & Flamingo Pink
    for (let h = 0; h < 12; h++) {
      const ha = (h / 12) * Math.PI * 2 - Math.PI / 2;
      ctx.strokeStyle = h % 3 === 0 ? P.ink_primary : P.accent_pink;
      ctx.lineWidth = h % 3 === 0 ? 9 : 5;
      ctx.beginPath();
      ctx.moveTo(Math.cos(ha) * 212, Math.sin(ha) * 212);
      ctx.lineTo(Math.cos(ha) * 248, Math.sin(ha) * 248);
      ctx.stroke();
    }

    ctx.restore();
  }

  // Clock Hands
  const minAngle = localF < 82 ? localF * 0.25 : 82 * 0.25 + shatterT * 2.5;
  const hrAngle = localF < 82 ? localF * 0.04 : 82 * 0.04 - shatterT * 1.2;

  ctx.save();
  ctx.translate(shatterT * 60, -shatterT * 90);
  ctx.rotate(minAngle);
  ctx.strokeStyle = P.accent_gold;
  ctx.shadowColor = P.accent_gold;
  ctx.shadowBlur = 20;
  ctx.lineWidth = 10;
  ctx.lineCap = "round";
  ctx.beginPath();
  ctx.moveTo(0, 35);
  ctx.lineTo(0, -210);
  ctx.stroke();
  ctx.restore();

  ctx.save();
  ctx.translate(-shatterT * 75, shatterT * 50);
  ctx.rotate(hrAngle);
  ctx.strokeStyle = P.accent_vermilion;
  ctx.shadowColor = P.accent_vermilion;
  ctx.shadowBlur = 20;
  ctx.lineWidth = 14;
  ctx.lineCap = "round";
  ctx.beginPath();
  ctx.moveTo(0, 25);
  ctx.lineTo(0, -145);
  ctx.stroke();
  ctx.restore();

  if (shatterT > 0) {
    ctx.save();
    ctx.globalAlpha = clamp(shatterT * 1.3, 0, 1);
    ctx.fillStyle = P.ink_primary;
    ctx.shadowColor = P.accent_vermilion;
    ctx.shadowBlur = 45;
    ctx.font = "900 76px 'DejaVu Sans Mono', monospace";
    ctx.textAlign = "center";
    ctx.fillText("00:00:00", 0, 24);
    ctx.restore();
  }

  ctx.restore();

  const titleS = spring(frame, f0 + 4, { stiffness: 220, damping: 16 });
  drawKineticTitle(ctx, "VEGAS SENSORY BLACKOUT", "TIME IS", "DELETED", P.accent_vermilion, 310, titleS);
}

// ============================================================================
// SHOT 2 (f: 175..297): FIRST-PERSON CASINO NEON TUNNEL & ETERNAL TWILIGHT
// ============================================================================
function renderShot02_NeonVault(ctx, frame, f0, dur) {
  const P = window.PAL;
  const localF = frame - f0;
  const prog = clamp(localF / dur, 0, 1);

  ctx.save();
  const bg = ctx.createRadialGradient(540, 960, 40, 540, 960, 1050);
  bg.addColorStop(0, P.bg_obsidian);
  bg.addColorStop(0.65, P.bg_elevated);
  bg.addColorStop(1, "#160B14");
  ctx.fillStyle = bg;
  ctx.fillRect(0, 0, 1080, 1920);

  const numArches = 9;
  const speed = (localF * 0.032) % 1;
  const archCols = [P.accent_vermilion, P.accent_gold, P.accent_pink, P.accent_emerald];
  for (let i = numArches - 1; i >= 0; i--) {
    const depth = ((i + 1 - speed) / numArches);
    const scale = 0.12 / Math.max(0.06, depth);
    const alpha = clamp((1 - depth) * 1.4, 0, 1) * clamp(scale < 3.2 ? 1 : 4.0 - scale, 0, 1);

    ctx.save();
    ctx.translate(540, 1040);
    ctx.scale(scale, scale);

    const cHex = archCols[i % archCols.length];
    ctx.strokeStyle = hexRgba(cHex, alpha * 0.9);
    ctx.shadowColor = cHex;
    ctx.shadowBlur = 28;
    ctx.lineWidth = 9;

    ctx.beginPath();
    ctx.roundRect(-340, -520, 680, 1040, 60);
    ctx.stroke();

    ctx.fillStyle = hexRgba(P.accent_emerald, alpha * 0.65);
    ctx.fillRect(-325, -180, 24, 360);
    ctx.fillRect(301, -180, 24, 360);

    ctx.restore();
  }

  const monoS = spring(frame, f0 + 6, { stiffness: 200, damping: 15 });
  ctx.save();
  ctx.translate(540, 1040);
  ctx.scale(monoS * (1 + prog * 0.18), monoS * (1 + prog * 0.18));

  ctx.fillStyle = hexRgba(P.bg_elevated, 0.95);
  ctx.strokeStyle = P.accent_gold;
  ctx.shadowColor = P.accent_gold;
  ctx.shadowBlur = 40;
  ctx.lineWidth = 7;
  ctx.beginPath();
  ctx.roundRect(-260, -160, 520, 320, 32);
  ctx.fill();
  ctx.stroke();
  ctx.shadowBlur = 0;

  for (let r = 0; r < 3; r++) {
    const rx = -195 + r * 135;
    ctx.fillStyle = P.bg_obsidian;
    ctx.strokeStyle = P.accent_pink;
    ctx.lineWidth = 4;
    ctx.beginPath();
    ctx.roundRect(rx, -110, 115, 175, 16);
    ctx.fill();
    ctx.stroke();

    const reelY = Math.sin(frame * 0.35 + r) * 8;
    ctx.fillStyle = r === 1 ? P.accent_vermilion : P.accent_gold;
    ctx.shadowColor = ctx.fillStyle;
    ctx.shadowBlur = 22;
    ctx.font = "900 105px 'Liberation Sans', sans-serif";
    ctx.textAlign = "center";
    ctx.fillText("7", rx + 57, 15 + reelY);
    ctx.shadowBlur = 0;
  }

  ctx.fillStyle = P.ink_primary;
  ctx.font = "bold 24px 'DejaVu Sans Mono', monospace";
  ctx.textAlign = "center";
  ctx.fillText("SEALED BUNKER // ETERNAL 7:00 PM", 0, 118);
  ctx.restore();

  ctx.restore();

  const titleS = spring(frame, f0 + 3, { stiffness: 240, damping: 16 });
  drawKineticTitle(ctx, "SENSORY ISOLATION CHAMBER", "ZERO", "WINDOWS", P.accent_gold, 310, titleS);
}

// ============================================================================
// SHOT 3 (f: 297..655): 3D ISOMETRIC LABYRINTH — CURVED DOPAMINE MAZE
// ============================================================================
function renderShot03_CurvedLabyrinth(ctx, frame, f0, dur) {
  const P = window.PAL;
  const localF = frame - f0;
  const prog = clamp(localF / dur, 0, 1);

  ctx.save();
  const bg = ctx.createRadialGradient(540, 1060, 50, 540, 1060, 1000);
  bg.addColorStop(0, hexRgba(P.accent_emerald, 0.32));
  bg.addColorStop(0.55, P.bg_obsidian);
  bg.addColorStop(1, P.bg_elevated);
  ctx.fillStyle = bg;
  ctx.fillRect(0, 0, 1080, 1920);

  ctx.save();
  ctx.translate(540, 1140);
  const camTilt = 0.68;
  ctx.scale(1.0 + prog * 0.18, (1.0 + prog * 0.18) * camTilt);
  ctx.rotate(prog * 0.45 - 0.22);

  // Jade Teal Perspective Blueprint Grid
  ctx.strokeStyle = hexRgba(P.accent_emerald, 0.26);
  ctx.lineWidth = 2.5;
  for (let g = -700; g <= 700; g += 70) {
    ctx.beginPath(); ctx.moveTo(g, -700); ctx.lineTo(g, 700); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(-700, g); ctx.lineTo(700, g); ctx.stroke();
  }

  // Spiral Casino Walkway in Marigold & Flamingo Pink
  ctx.save();
  ctx.strokeStyle = hexRgba(P.accent_pink, 0.28);
  ctx.lineWidth = 115;
  ctx.lineCap = "round";
  ctx.beginPath();
  for (let t = 0; t <= 1; t += 0.02) {
    const angle = t * Math.PI * 3.4;
    const rad = 80 + t * 440;
    const px = Math.cos(angle) * rad;
    const py = Math.sin(angle) * rad;
    if (t === 0) ctx.moveTo(px, py);
    else ctx.lineTo(px, py);
  }
  ctx.stroke();

  ctx.strokeStyle = P.accent_gold;
  ctx.shadowColor = P.accent_gold;
  ctx.shadowBlur = 25;
  ctx.lineWidth = 12;
  ctx.stroke();
  ctx.shadowBlur = 0;
  ctx.restore();

  // 3D Extruded Slot Machine Pillars in Vermilion, Jade Teal & Flamingo Pink
  const totalPillars = 22;
  const pCols = [P.accent_vermilion, P.accent_emerald, P.accent_pink, P.accent_gold];
  for (let p = 0; p < totalPillars; p++) {
    const pt = (p + 0.5) / totalPillars;
    const pang = pt * Math.PI * 3.4;
    const prad = 80 + pt * 440 + (p % 2 === 0 ? 75 : -75);
    const px = Math.cos(pang) * prad;
    const py = Math.sin(pang) * prad;

    ctx.fillStyle = pCols[p % pCols.length];
    ctx.shadowColor = ctx.fillStyle;
    ctx.shadowBlur = 18;
    ctx.beginPath();
    ctx.arc(px, py, 17, 0, Math.PI * 2);
    ctx.fill();
    ctx.shadowBlur = 0;
  }

  // Subject walking along the spiral
  const walkT = clamp(0.92 - prog * 0.78, 0.08, 0.95);
  const wAng = walkT * Math.PI * 3.4;
  const wRad = 80 + walkT * 440;
  const wx = Math.cos(wAng) * wRad;
  const wy = Math.sin(wAng) * wRad;

  const nextT = Math.max(0.01, walkT - 0.02);
  const nAng = nextT * Math.PI * 3.4;
  const nRad = 80 + nextT * 440;
  const dirA = Math.atan2(Math.sin(nAng) * nRad - wy, Math.cos(nAng) * nRad - wx);

  ctx.save();
  ctx.translate(wx, wy);
  ctx.rotate(dirA);
  const coneGrad = ctx.createLinearGradient(0, 0, 260, 0);
  coneGrad.addColorStop(0, hexRgba(P.accent_vermilion, 0.72));
  coneGrad.addColorStop(1, hexRgba(P.accent_vermilion, 0));
  ctx.fillStyle = coneGrad;
  ctx.beginPath();
  ctx.moveTo(0, 0);
  ctx.lineTo(260, -95);
  ctx.lineTo(260, 95);
  ctx.closePath();
  ctx.fill();

  ctx.fillStyle = P.ink_primary;
  ctx.shadowColor = P.accent_vermilion;
  ctx.shadowBlur = 30;
  ctx.beginPath();
  ctx.arc(0, 0, 24, 0, Math.PI * 2);
  ctx.fill();
  ctx.shadowBlur = 0;
  ctx.restore();

  ctx.restore();

  const badgeS = spring(frame, f0 + 18, { stiffness: 210, damping: 15 });
  ctx.save();
  ctx.translate(540, 620);
  ctx.scale(badgeS, badgeS);
  ctx.fillStyle = hexRgba(P.bg_elevated, 0.92);
  ctx.strokeStyle = P.accent_vermilion;
  ctx.lineWidth = 5;
  ctx.beginPath();
  ctx.roundRect(-370, -68, 740, 136, 24);
  ctx.fill();
  ctx.stroke();

  ctx.fillStyle = P.accent_vermilion;
  ctx.font = "900 34px 'DejaVu Sans Mono', monospace";
  ctx.textAlign = "center";
  ctx.fillText("90° CORNERS TRIGGER EXIT DECISIONS", 0, -8);
  ctx.fillStyle = P.accent_emerald;
  ctx.font = "bold 26px 'DejaVu Sans Mono', monospace";
  ctx.fillText("CURVED PATHS KEEP THE BRAIN ON AUTOPILOT", 0, 36);
  ctx.restore();

  ctx.restore();

  const titleS = spring(frame, f0 + 4, { stiffness: 220, damping: 16 });
  drawKineticTitle(ctx, "FRIEDMAN'S LABYRINTH RULE", "ZERO 90°", "CORNERS", P.accent_emerald, 310, titleS);
}

// ============================================================================
// SHOT 4 (f: 655..985): $100 BILL DISINTEGRATING INTO 3D CASINO CHIP VORTEX
// ============================================================================
function renderShot04_ChipVortex(ctx, frame, f0, dur) {
  const P = window.PAL;
  const localF = frame - f0;
  const prog = clamp(localF / dur, 0, 1);
  const morphT = easeInOutCubic(clamp((localF - 35) / 55, 0, 1));

  ctx.save();
  const bg = ctx.createRadialGradient(540, 920, 40, 540, 920, 1050);
  bg.addColorStop(0, morphT > 0.5 ? hexRgba(P.accent_vermilion, 0.28) : hexRgba(P.accent_emerald, 0.32));
  bg.addColorStop(0.6, P.bg_obsidian);
  bg.addColorStop(1, P.bg_elevated);
  ctx.fillStyle = bg;
  ctx.fillRect(0, 0, 1080, 1920);

  ctx.save();
  ctx.translate(540, 880);

  if (morphT < 0.95) {
    const billS = spring(frame, f0 + 4, { stiffness: 210, damping: 15 });
    ctx.save();
    ctx.scale(billS * (1 + morphT * 0.35), billS * (1 - morphT * 0.65));
    ctx.rotate(morphT * 0.25);
    ctx.globalAlpha = clamp(1 - morphT * 1.15, 0, 1);

    ctx.fillStyle = P.bg_elevated;
    ctx.strokeStyle = P.accent_emerald;
    ctx.shadowColor = P.accent_emerald;
    ctx.shadowBlur = 35;
    ctx.lineWidth = 10;
    ctx.beginPath();
    ctx.roundRect(-350, -175, 700, 350, 28);
    ctx.fill();
    ctx.stroke();
    ctx.shadowBlur = 0;

    ctx.strokeStyle = P.accent_gold;
    ctx.lineWidth = 4;
    ctx.beginPath();
    ctx.roundRect(-315, -140, 630, 280, 18);
    ctx.stroke();

    ctx.fillStyle = P.ink_primary;
    ctx.font = "900 138px 'DejaVu Sans Mono', monospace";
    ctx.textAlign = "center";
    ctx.fillText("$100", 0, 48);
    ctx.restore();
  }

  // 14 3D Casino Chips in the exact 6-Swatch Rooster Palette!
  if (morphT > 0.02) {
    const numChips = 14;
    const colors = [P.accent_vermilion, P.accent_gold, P.accent_emerald, P.accent_pink];
    const values = ["100", "500", "25", "1K"];

    for (let c = 0; c < numChips; c++) {
      const cDelay = f0 + 30 + (c % 5) * 4;
      const cSpring = spring(frame, cDelay, { stiffness: 180, damping: 14 });
      if (cSpring <= 0.01) continue;

      const angle = (c / numChips) * Math.PI * 2 + 0.35;
      const radius = (c < 3) ? (c - 1) * 235 : (190 + (c % 3) * 145);
      const targetX = c < 3 ? (c - 1) * 245 : Math.cos(angle) * radius;
      const targetY = c < 3 ? -30 + Math.sin(frame * 0.08 + c) * 18 : Math.sin(angle) * (radius * 0.68);

      const scaleChip = c < 3 ? 1.18 * cSpring : (0.52 + (c % 3) * 0.16) * cSpring;
      const tiltY = c < 3 ? 0.88 : 0.65 + 0.25 * Math.sin(frame * 0.07 + c);

      ctx.save();
      ctx.translate(targetX * cSpring, targetY * cSpring);
      ctx.rotate((c < 3 ? 0 : (frame * 0.02 * (c % 2 === 0 ? 1 : -1))));
      ctx.scale(scaleChip, scaleChip * tiltY);

      const col = colors[c % colors.length];
      ctx.fillStyle = P.bg_elevated;
      ctx.beginPath();
      ctx.arc(0, 14, 105, 0, Math.PI * 2);
      ctx.fill();

      ctx.shadowColor = "rgba(18, 6, 15, 0.85)";
      ctx.shadowBlur = 30;
      ctx.fillStyle = col;
      ctx.beginPath();
      ctx.arc(0, 0, 105, 0, Math.PI * 2);
      ctx.fill();
      ctx.shadowBlur = 0;

      ctx.strokeStyle = P.ink_primary;
      ctx.lineWidth = 14;
      ctx.setLineDash([22, 22]);
      ctx.beginPath();
      ctx.arc(0, 0, 88, 0, Math.PI * 2);
      ctx.stroke();
      ctx.setLineDash([]);

      ctx.fillStyle = P.bg_obsidian;
      ctx.beginPath();
      ctx.arc(0, 0, 64, 0, Math.PI * 2);
      ctx.fill();

      ctx.fillStyle = P.ink_primary;
      ctx.font = "900 44px 'DejaVu Sans Mono', monospace";
      ctx.textAlign = "center";
      ctx.fillText(values[c % values.length], 0, 16);

      ctx.restore();
    }
  }
  ctx.restore();

  const painVal = Math.round(92 - 84 * morphT);
  ctx.save();
  ctx.translate(540, 1520);

  ctx.strokeStyle = painVal > 35 ? P.accent_emerald : P.accent_vermilion;
  ctx.shadowColor = ctx.strokeStyle;
  ctx.shadowBlur = 22;
  ctx.lineWidth = 7;
  ctx.beginPath();
  const amp = 10 + (painVal / 100) * 85;
  for (let x = -420; x <= 420; x += 12) {
    const wave = Math.sin(x * 0.045 + frame * 0.35) * Math.cos(x * 0.015 - frame * 0.2) * amp;
    if (x === -420) ctx.moveTo(x, -110 + wave);
    else ctx.lineTo(x, -110 + wave);
  }
  ctx.stroke();
  ctx.shadowBlur = 0;

  ctx.fillStyle = P.ink_primary;
  ctx.font = "900 96px 'Liberation Sans', sans-serif";
  ctx.textAlign = "center";
  ctx.fillText(`PAIN OF PAYING: ${painVal}%`, 0, 35);

  ctx.fillStyle = P.accent_pink;
  ctx.font = "bold 28px 'DejaVu Sans Mono', monospace";
  ctx.fillText(painVal < 30 ? "BRAIN ANESTHETIZED BY PLASTIC TOKENS" : "NATURAL LOSS AVERSION ACTIVE", 0, 92);
  ctx.restore();

  ctx.restore();

  const titleS = spring(frame, f0 + 4, { stiffness: 220, damping: 16 });
  drawKineticTitle(ctx, "NEURAL ANESTHESIA", "CASH TO", "PLASTIC", P.accent_pink, 310, titleS);
}

window.seekToFrame = function(frame) {
  if (!window.BEAT_CLOCK) return false;
  const beats = window.BEAT_CLOCK.beats;
  const b1 = beats[0];
  const b2 = beats[1];
  const b3 = beats[2];

  const splitB1 = 175;
  let flash = 0;

  if (frame < splitB1) {
    renderShot01_ClockShatter(ctx, frame, 0, splitB1);
    if (frame < 5) flash = (5 - frame) / 5;
  } else if (frame < b1.end_frame) {
    renderShot02_NeonVault(ctx, frame, splitB1, b1.end_frame - splitB1);
    if (frame - splitB1 < 6) flash = (6 - (frame - splitB1)) / 6;
  } else if (frame < b2.end_frame) {
    renderShot03_CurvedLabyrinth(ctx, frame, b2.start_frame, b2.duration_frames);
    if (frame - b2.start_frame < 6) flash = (6 - (frame - b2.start_frame)) / 6;
  } else {
    renderShot04_ChipVortex(ctx, frame, b3.start_frame, b3.duration_frames);
    if (frame - b3.start_frame < 6) flash = (6 - (frame - b3.start_frame)) / 6;
  }

  applyPostProcessing(ctx, frame, flash);
  return true;
};
</script>
